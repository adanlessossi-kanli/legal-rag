name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ── Backend tests ──────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests/ -m "not integration" -v
        env:
          OPENAI_API_KEY: test-key
          JWT_SECRET: test-secret

  # ── Backend integration tests (real MongoDB) ───────────────────
  backend-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.0
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Create vector index
        run: python ../scripts/create_vector_index.py

      - name: Integration tests
        run: pytest tests/test_integration.py -m integration -v
        env:
          OPENAI_API_KEY: test-key
          JWT_SECRET: test-secret

  # ── Frontend lint & build ──────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Build & push Docker images ─────────────────────────────────
  build-images:
    needs: [backend-test, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: ./backend
            image_env: BACKEND_IMAGE
          - context: ./frontend
            image_env: FRONTEND_IMAGE
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env[matrix.image_env] }}:${{ github.sha }}
            ${{ env[matrix.image_env] }}:latest

  # ── Run database migrations ────────────────────────────────────
  migrate:
    needs: [build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install motor python-dotenv

      - name: Run migrations
        run: python backend/migrations/runner.py
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT }}
          MONGODB_CLIENT_ID: ${{ secrets.MONGODB_CLIENT_ID }}
          MONGODB_CLIENT_SECRET: ${{ secrets.MONGODB_CLIENT_SECRET }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          MONGODB_OPTIONS: ${{ secrets.MONGODB_OPTIONS }}

  # ── Deploy (placeholder — replace with your target) ────────────
  deploy:
    needs: [build-images, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deploy step — replace with your deployment target."
          echo "Images available:"
          echo "  ${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          echo "  ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          # Examples:
          #   aws ecs update-service ...
          #   kubectl set image ...
          #   docker compose -f docker-compose.prod.yml up -d
